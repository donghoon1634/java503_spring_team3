<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <title>Title</title>
</head>
<body>
<form action="/profile/insert" method="post" enctype="multipart/form-data">
  <!-- 첨부파일 추가 -->
  <div class="mt-3">
    <label for="upload-files" class="form-label">첨부파일 : </label>
    <input type="file" class="form-control" id="upload-files" name="uploadFiles" multiple>
  </div>
  <div class="mt-3 row">
    <div class="col-sm d-grid">
      <button type="submit" class="btn btn-primary">전송</button>
    </div>
    <div class="col-sm d-grid">
      <button type="reset" class="btn btn-secondary" id="btn-cancel">취소</button>
    </div>
  </div>
</form>
<div class="container mt-5">
  <img src="" alt="프로필 이미지" th:src="@{${memberProfileHref}}" width="200" height="200" class="rounded-circle">
</div>
</body>
</html>
