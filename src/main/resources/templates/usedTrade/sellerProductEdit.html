<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지에서 들어와서 수정하는 게시글</title>

    <link rel="stylesheet" href="/css/bootstrap.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script>
        $(document).ready(function () {
            $("#btn-list").on("click", function () {
                history.back();
            });

            $("#btn-edit").on("click", function () {
                $("#method").val("PUT");

                var frm = $("#frm")[0];
                frm.action = "/potato/myPage/edit/1";
                frm.submit();
            });

            $("#btn-delete").on("click", function () {
                history.back();
            });

        });

    </script>
</head>
<body>
<header th:replace="~{/layout/header :: navbar}"></header>
<header th:replace="~{/layout/header :: search}"></header>

<div class="container mt-5">
    <main class="d-flex">
        <section>
            <aside>
                <div class="row mt-5">
                    <img src="https://img.kr.gcp-karroter.net/origin/article/202502/9be1aaa2550f973c9b9fe9e270955076ebcddb4230c1fae17b25d212dd1a1e33_0.webp?f=webp&q=95&s=720x720&t=inside" th:src="${editList.productEditImg}"
                         style="width: 300px" height="300px" alt="기본 이미지">
                </div>
                <div class="col-sm mt-2">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="seller" name="productEditUser" readonly >
                        <label for="seller">판매자</label>
                    </div>
                </div>
            </aside>
        </section>

        <form class="mt-3" id="frm" method="post">
            <input type="hidden" id="method" name="_method" value="PUT">
            <div class="container row mt-5" th:each="item:${editList}">
                <div class="form-floating">
                    <div class="col-sm">
                        <input type="text" class="form-control" id="title" name="productEditTitle" placeholder="제목을 입력하세요" th:value="${editList.productEditTitle}">
                        <label for="title"></label>
                    </div>
                </div>

                <div class="form-floating">
                    <div class="col-sm">
                        <input type="text" class="form-control" id="price" name="productEditPrice" placeholder="가격을 입력하세요" th:value="${editList.productEditPrice}">
                        <label for="price"></label>
                    </div>
                </div>

                <div class="form-floating">
                    <div class="col-sm">
                        <textarea class="form-control" id="comment" name="productEditContents" placeholder="내용을 입력하세요" th:text="${editList.productEditContents}" rows="10"
                                  style="height: 200px"></textarea>
                        <label for="comment"></label>
                    </div>
                </div>
            </div>
        </form>


    </main>
    <div class="row mt-3">
        <div class="col-sm">
            <button class="btn btn-secondary" id="btn-list">목록</button>
        </div>
        <div class="col-sm d-flex justify-content-end">
            <button type="submit" class="me-2 btn btn-warning" id="btn-edit">수정 완료</button>
            <button class="btn btn-danger" id="btn-delete">삭제</button>
        </div>
    </div>
</div>

<footer th:replace="~{/layout/footer :: footer}"></footer>
</body>
</html>
