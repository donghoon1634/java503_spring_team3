<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <style>
        @font-face {
            font-family: 'Pretendard-Regular';
            src: url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
        }

        * {
            font-family: 'Pretendard-Regular';
        }

        .area-list {
            display: none;
            margin-left: 20px;
        }

        .filter-container {
            display: flex;
            gap: 20px;
        }

        .filter-container aside {
            flex: 1;
        }

        .filter-container main {
            flex: 3;
        }

        .card {
            min-height: 300px;
            /* 카드 높이 균일하게 설정 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-img-top {
            height: 200px;
            /* 모든 이미지 높이를 동일하게 설정 */
            object-fit: cover;
            /* 비율 유지하면서 꽉 채우기 */
            width: 100%;
        }

        #btn-share,
        #btn-5000,
        #btn-10000,
        #btn-20000 {
            border: 1px solid #c7c7c7;
            border-radius: 20px;
            background-color: #ffffff;
            padding: 8px;
        }

        .category-ul,
        .price-ul {
            padding: 0;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 10px;
        }

        .card-price {
            font-weight: bold;
        }

        .card-location {
            font-size: 14px;
            color: #9b9b9b;
        }

        /* 추가된 부분: 상품 목록 그리드 */
        .product-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>

    <script>

        let isLocalGuFetched = false; // 지역구 목록이 불러와졌는지 여부를 확인하는 변수
        let isCategoryFetched = false; // 카테고리 목록이 불러와졌는지 여부를 확인하는 변수

        // 지역구 목록을 서버에서 가져와서 보여주는 함수
        function fetchLocalGuNames() {
            if (isLocalGuFetched) return;

            fetch('/potato/trade/local-gus')
                .then(response => response.json())
                .then(data => {
                    const localGuList = document.getElementById("localGuList");
                    if (!localGuList) {
                        console.error("지역구 목록을 표시할 요소가 없습니다.");
                        return;
                    }
                    localGuList.innerHTML = "";

                    if (Array.isArray(data)) {
                        data.forEach((localGuName, index) => {
                            const label = document.createElement("label");
                            label.style.display = "block";
                            const radio = document.createElement("input");
                            radio.type = "radio";
                            radio.name = "localGu";
                            radio.value = localGuName;
                            radio.id = "localGu_" + index;
                            radio.onclick = () => fetchProductsByLocal(localGuName);

                            label.appendChild(radio);
                            label.appendChild(document.createTextNode(localGuName));
                            localGuList.appendChild(label);
                        });
                    } else {
                        console.error('지역구 목록이 배열이 아닙니다:', data);
                        const localGuNames = Object.values(data);
                        localGuNames.forEach((localGuName, index) => {
                            const label = document.createElement("label");
                            label.style.display = "block";
                            const radio = document.createElement("input");
                            radio.type = "radio";
                            radio.name = "localGu";
                            radio.value = localGuName;
                            radio.id = "localGu_" + index;
                            radio.onclick = () => fetchProductsByLocal(localGuName);

                            label.appendChild(radio);
                            label.appendChild(document.createTextNode(localGuName));
                            localGuList.appendChild(label);
                        });
                    }
                    isLocalGuFetched = true;
                })
                .catch(error => console.error("지역구 목록을 불러오는 중 오류 발생:", error));
        }

        // 지역구 목록 보이기/숨기기
        function toggleLocalGuList() {
            const localGuList = document.getElementById("localGuList");
            if (!localGuList) {
                console.error("지역구 목록을 표시할 요소가 없습니다.");
                return;
            }

            localGuList.style.display = localGuList.style.display === "none" || localGuList.style.display === "" ? "block" : "none";
            if (localGuList.style.display === "block") {
                fetchLocalGuNames();
            }
        }

        // 카테고리 목록을 서버에서 가져오는 함수
        function fetchCategoryNames() {
            if (isCategoryFetched) return;

            fetch('/potato/trade/categories')
                .then(response => response.json())
                .then(data => {
                    const categoryList = document.getElementById("categoryList");
                    if (!categoryList) {
                        console.error("카테고리 목록을 표시할 요소가 없습니다.");
                        return;
                    }
                    categoryList.innerHTML = "";

                    if (Array.isArray(data)) {
                        data.forEach((category, index) => {
                            const label = document.createElement("label");
                            label.style.display = "block";
                            const radio = document.createElement("input");
                            radio.type = "radio";
                            radio.name = "category";
                            radio.value = category.categoryName;
                            radio.id = "category_" + index;
                            radio.onclick = () => fetchProductsByCategory(category);

                            label.appendChild(radio);
                            label.appendChild(document.createTextNode(category.categoryName));
                            categoryList.appendChild(label);
                        });
                    } else {
                        console.error('카테고리 목록이 배열이 아닙니다:', data);
                        const categoryNames = Object.values(data);
                        categoryNames.forEach((category, index) => {
                            const label = document.createElement("label");
                            label.style.display = "block";
                            const radio = document.createElement("input");
                            radio.type = "radio";
                            radio.name = "category";
                            radio.value = category.categoryName;
                            radio.id = "category_" + index;
                            radio.onclick = () => fetchProductsByCategory(category);

                            label.appendChild(radio);
                            label.appendChild(document.createTextNode(category.categoryName));
                            categoryList.appendChild(label);
                        });
                    }

                    isCategoryFetched = true;
                })
                .catch(error => console.error("카테고리 목록을 불러오는 중 오류 발생:", error));
        }

        // 카테고리 선택 시 상품 목록을 AJAX로 가져오는 함수
        function fetchProductsByCategory(category) {
            const categoryName = category.categoryName;
            const localGuName = ""; // 지역구 값을 빈 문자열로 처리하거나 선택된 지역구 값을 넣습니다

            fetch(`/potato/trade/products/category?localGuName=${localGuName}&categoryName=${categoryName}`)
                .then(response => response.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        updateProductList(data);
                    } else {
                        console.error('상품 목록을 배열로 변환할 수 없습니다:', data);
                    }
                })
                .catch(error => {
                    console.error("상품 목록을 가져오는 중 오류 발생:", error);
                });
        }

        // 지역구 선택 시 상품 목록을 AJAX로 가져오는 함수
        function fetchProductsByLocal(localGuName) {
            fetch(`/potato/trade/products/local?localGuName=${localGuName}`)
                .then(response => response.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        updateProductList(data);
                    } else {
                        console.error('상품 목록을 배열로 변환할 수 없습니다:', data);
                    }
                })
                .catch(error => {
                    console.error("상품 목록을 가져오는 중 오류 발생:", error);
                });
        }

        // 나눔 버튼 클릭 시 상품 목록 필터링하는 함수
        function fetchProductsByShare() {
            fetch('/potato/trade/products/share')
                .then(response => response.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        updateProductList(data);
                    } else {
                        console.error('상품 목록이 배열이 아닙니다:', data);
                    }
                })
                .catch(error => {
                    console.error("나눔 상품 목록을 가져오는 중 오류 발생:", error);
                });
        }

        // 상품 목록을 동적으로 업데이트하는 함수
        function updateProductList(productList) {
            const productListContainer = document.getElementById("productListContainer");
            if (!productListContainer) {
                console.error("상품 목록을 표시할 요소가 없습니다.");
                return;
            }

            productListContainer.innerHTML = '';

            if (Array.isArray(productList)) {
                productList.forEach(product => {
                    const productCard = document.createElement("div");
                    productCard.className = "product-card col-lg-3 col-md-4 col-sm-6 mb-4";
                    productCard.innerHTML = `
        <div class="card">
          <img src="${product.productImg}" class="card-img-top" alt="상품 이미지">
          <div class="card-body">
            <p class="card-title">${product.productName}</p>
            <p class="card-price">${product.productPrice}</p>
            <p class="card-location">${product.localGuName}</p>
          </div>
        </div>
      `;
                    productListContainer.appendChild(productCard);
                });
            } else {
                console.error('상품 목록이 배열이 아닙니다:', productList);
            }
        }

        // 페이지가 로드되면 카테고리 목록을 불러옵니다.
        document.addEventListener("DOMContentLoaded", function() {
            fetchCategoryNames();  // DOM이 준비되면 카테고리 목록을 가져옵니다.

            // 나눔 버튼 클릭 이벤트 추가
            const shareButton = document.querySelector(".price-btn[data-type='free']");
            if (shareButton) {
                shareButton.addEventListener("click", function() {
                    fetchProductsByShare();
                });
            } else {
                console.error("나눔 버튼을 찾을 수 없습니다.");
            }
        });

        document.addEventListener("DOMContentLoaded", function() {
            // 나눔 버튼 이벤트 추가
            document.querySelector(".price-btn").addEventListener("click", function() {
                fetchProductsByShare(); // 클릭 시 나눔 상품만 가져오기
            });
        });

    </script>




</head>

<body>
<div class="container mt-5 filter-container">
    <aside>
        <div class="d-flex">
            <h3><strong>필터</strong></h3>
            <a href="#" class="reset-filter" style="color: gray; margin-left: 100px;">초기화</a>
        </div>
        <br>

        <div class="border-top mt-2 mb-2"></div>

        <!-- 지역구 선택 버튼 -->
        <h5 style="margin-top: 20px;"><b>부산광역시</b></h5>
        <button onclick="toggleLocalGuList()">지역구 선택</button>
        <ul id="localGuList" style="display: none;">
            <!-- 지역구 목록을 JavaScript로 동적으로 추가 -->
        </ul>

        <!-- 카테고리 선택 부분 -->
        <h5 style="margin-top: 20px;"><b>카테고리</b></h5>
        <ul id="categoryList">
            <!-- 카테고리 목록을 JavaScript 로 동적으로 추가 -->
        </ul>

        <div style="width: 200px; height: 1px; background-color: black; margin-top: 10px;"></div>


        <!--    나눔-->
        <h5 style="margin-top: 20px;"><b>share</b></h5>
        <ul>
            <li style="list-style: none;">
                <button type="button" class="price-btn" data-min="null" data-max="null" data-type="free">나눔</button>
            </li>
        </ul>
    </aside>
    <main>

        <!--상품 목록-->
        <section class="row item-list" id="productList">
            <div id="productListContainer" class="row">
                <!-- 타임리프로 서버에서 렌더링된 상품 목록 -->
                <div th:if="${#lists.size(productList)} > 0" th:each="product : ${productList}"
                     class="product-card col-lg-3 col-md-4 col-sm-6 mb-4">
                    <div class="card">
                        <img th:src="@{|${product.productImg}|}" class="card-img-top" alt="상품 이미지">
                        <div class="card-body">
                            <p class="card-title" th:text="${product.productName}">상품 제목</p>
                            <p class="card-price" th:text="${product.productPrice}">1000원</p>
                            <p class="card-location" th:text="${product.localGuName}">상품 위치</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

</div>


</body>

</html>
