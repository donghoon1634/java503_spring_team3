<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <style>
      @font-face {
          font-family: 'Pretendard-Regular';
          src: url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
          font-weight: 400;
          font-style: normal;
      }

      * {
          font-family: 'Pretendard-Regular';
      }

      .area-list {
          display: none;
          margin-left: 20px;
      }

      .filter-container {
          display: flex;
          gap: 20px;
      }

      .filter-container aside {
          flex: 1;
      }

      .filter-container main {
          flex: 3;
      }

      .card {
          min-height: 300px;
          /* 카드 높이 균일하게 설정 */
          display: flex;
          flex-direction: column;
          justify-content: space-between;
      }

      .card-img-top {
          height: 200px;
          /* 모든 이미지 높이를 동일하게 설정 */
          object-fit: cover;
          /* 비율 유지하면서 꽉 채우기 */
          width: 100%;
      }

      #btn-share,
      #btn-5000,
      #btn-10000,
      #btn-20000 {
          border: 1px solid #c7c7c7;
          border-radius: 20px;
          background-color: #ffffff;
          padding: 8px;
      }

      .category-ul,
      .price-ul {
          padding: 0;
      }

      input[type="radio"],
      input[type="checkbox"] {
          margin-right: 10px;
      }

      .card-price {
          font-weight: bold;
      }

      .card-location {
          font-size: 14px;
          color: #9b9b9b;
      }

      /* 추가된 부분: 상품 목록 그리드 */
      .product-card {
          display: flex;
          flex-direction: column;
          justify-content: space-between;
      }
  </style>

  <script>
      let isLocalGuFetched = false;
      let isCategoryFetched = false;

      // 지역구 목록 불러오기
      function fetchLocalGuNames() {
          if (isLocalGuFetched) return;

          fetch('/potato/trade/local-gus')
              .then(response => response.json())
              .then(data => {
                  const localGuList = document.getElementById("localGuList");
                  if (!localGuList) {
                      console.error("지역구 목록을 표시할 요소가 없습니다.");
                      return;
                  }
                  localGuList.innerHTML = "";

                  let localGuNames = Array.isArray(data) ? data : Object.values(data);
                  localGuNames.forEach((localGuName, index) => {
                      const label = document.createElement("label");
                      label.style.display = "block";

                      const radio = document.createElement("input");
                      radio.type = "radio";
                      radio.name = "localGu";
                      radio.value = localGuName;
                      radio.id = "localGu_" + index;
                      radio.onclick = () => fetchProductsByLocal(localGuName);

                      label.appendChild(radio);
                      label.appendChild(document.createTextNode(localGuName));
                      localGuList.appendChild(label);
                  });

                  isLocalGuFetched = true;
              })
              .catch(error => console.error("지역구 목록을 불러오는 중 오류 발생:", error));
      }

      // 지역구 목록 토글
      function toggleLocalGuList() {
          const localGuList = document.getElementById("localGuList");
          if (!localGuList) {
              console.error("지역구 목록을 표시할 요소가 없습니다.");
              return;
          }

          localGuList.style.display = localGuList.style.display === "none" || localGuList.style.display === "" ? "block" : "none";
          if (localGuList.style.display === "block") fetchLocalGuNames();
      }

      // 카테고리 목록 불러오기
      function fetchCategoryNames() {
          if (isCategoryFetched) return;

          fetch('/potato/trade/categories')
              .then(response => response.json())
              .then(data => {
                  const categoryList = document.getElementById("categoryList");
                  if (!categoryList) {
                      console.error("카테고리 목록을 표시할 요소가 없습니다.");
                      return;
                  }
                  categoryList.innerHTML = "";

                  let categories = Array.isArray(data) ? data : Object.values(data);
                  categories.forEach((category, index) => {
                      const label = document.createElement("label");
                      label.style.display = "block";

                      const radio = document.createElement("input");
                      radio.type = "radio";
                      radio.name = "category";
                      radio.value = category.categoryName;
                      radio.id = "category_" + index;
                      radio.onclick = () => fetchProductsByCategory(category.categoryName);

                      label.appendChild(radio);
                      label.appendChild(document.createTextNode(category.categoryName));
                      categoryList.appendChild(label);
                  });

                  isCategoryFetched = true;
              })
              .catch(error => console.error("카테고리 목록을 불러오는 중 오류 발생:", error));
      }

      // 지역구별 상품 목록 불러오기
      function fetchProductsByLocal(localGuName) {
          const url = new URL(window.location.href);
          url.searchParams.set('localGu', localGuName); // 지역구 필터 업데이트
          window.history.pushState({}, "", url); // URL 변경 (새로고침 없이)

          fetch(`/potato/trade/products/local?localGuName=${encodeURIComponent(localGuName)}`)
              .then(response => response.json())
              .then(data => {
                  if (Array.isArray(data)) {
                      updateProductList(data);
                  } else {
                      console.error('상품 목록이 배열이 아닙니다:', data);
                  }
              })
              .catch(error => console.error("상품 목록을 가져오는 중 오류 발생:", error));
      }

      // 카테고리별 상품 목록 불러오기
      function fetchProductsByCategory(categoryName) {
          const url = new URL(window.location.href);
          url.searchParams.set('category', categoryName); // 카테고리 필터 업데이트
          window.history.pushState({}, "", url); // URL 변경 (새로고침 없이)

          fetch(`/potato/trade/products/category?categoryName=${encodeURIComponent(categoryName)}`)
              .then(response => response.json())
              .then(data => {
                  if (Array.isArray(data)) {
                      updateProductList(data);
                  } else {
                      console.error('상품 목록이 배열이 아닙니다:', data);
                  }
              })
              .catch(error => console.error("상품 목록을 가져오는 중 오류 발생:", error));
      }

      // 나눔 상품 목록 불러오기
      function fetchProductsByShare() {
          const url = new URL(window.location.href);
          url.searchParams.set('share', 'true'); // 나눔 필터 업데이트
          window.history.pushState({}, "", url); // URL 변경 (새로고침 없이)

          fetch('/potato/trade/products/share')
              .then(response => response.json())
              .then(data => {
                  if (Array.isArray(data)) {
                      updateProductList(data);
                  } else {
                      console.error('상품 목록이 배열이 아닙니다:', data);
                  }
              })
              .catch(error => console.error("나눔 상품 목록을 가져오는 중 오류 발생:", error));
      }

      // 상품 목록 업데이트
      function updateProductList(productList) {
          const productListContainer = document.getElementById("productListContainer");
          if (!productListContainer) {
              console.error("상품 목록을 표시할 요소가 없습니다.");
              return;
          }

          // 기존 목록을 지운다.
          productListContainer.innerHTML = '';

          productList.forEach(product => {
              const productCard = document.createElement("div");
              productCard.className = "product-card col-lg-3 col-md-4 col-sm-6 mb-4";
              productCard.setAttribute("data-product-num", product.productNum);  // productNum을 data 속성으로 추가

              productCard.innerHTML = `
            <div class="card" style="cursor: pointer;">
                <img src="${product.productImg}" class="card-img-top" alt="상품 이미지">
                <div class="card-body">
                    <p class="card-title">${product.productName}</p>
                    <p class="card-price">${product.productPrice}</p>
                    <p class="card-location">${product.localGuName}</p>
                </div>
            </div>
        `;

              // 클릭 이벤트 추가: productNum을 이용하여 상세 페이지로 이동
              productCard.addEventListener("click", function () {
                  const productNum = productCard.getAttribute("data-product-num");
                  window.location.href = `/potato/trade/productDetail?productNum=${encodeURIComponent(productNum)}`;
              });

              // 상품 카드를 컨테이너에 추가
              productListContainer.appendChild(productCard);
          });
      }

      // 페이지 로드 시 초기화
      document.addEventListener("DOMContentLoaded", function () {
          fetchCategoryNames();

          // 나눔 버튼 클릭 이벤트 추가
          const shareButton = document.querySelector(".price-btn[data-type='free']");
          if (shareButton) {
              shareButton.addEventListener("click", fetchProductsByShare);
          } else {
              console.error("나눔 버튼을 찾을 수 없습니다.");
          }

          // 지역구 및 카테고리 선택 시 필터링 처리
          const localGuRadios = document.querySelectorAll("input[name='localGu']");
          localGuRadios.forEach(radio => {
              radio.addEventListener("click", (e) => {
                  fetchProductsByLocal(e.target.value);
              });
          });

          const categoryRadios = document.querySelectorAll("input[name='category']");
          categoryRadios.forEach(radio => {
              radio.addEventListener("click", (e) => {
                  fetchProductsByCategory(e.target.value);
              });
          });

          // 필터 초기화
          const resetButton = document.getElementById("resetButton");
          if (resetButton) {
              resetButton.addEventListener("click", () => {
                  // URL 초기화
                  const url = new URL(window.location.href);
                  url.searchParams.delete('localGu');
                  url.searchParams.delete('category');
                  url.searchParams.delete('share');
                  window.history.pushState({}, "", url); // URL 변경

                  // 필터 초기화
                  document.querySelectorAll("input[name='localGu']").forEach(radio => radio.checked = false);
                  document.querySelectorAll("input[name='category']").forEach(radio => radio.checked = false);
              });
          }
      });
  </script>


</head>
<header th:replace="/layout/header :: navbar"></header>
<header th:replace="/layout/header :: search"></header>
<body>
<div class="container mt-5 filter-container">
  <aside>
    <div class="d-flex justify-content-between align-items-center">
      <h3><strong>필터</strong></h3>
      <div class="d-flex gap-3">
        <!-- 초기화 버튼 -->
        <button  id="resetButton" class="me-5 link-dark hover-effect">초기화</button>

        <!-- 제품 등록 버튼 (로그인된 경우만 표시) -->
        <div th:if="${isLoggedIn}">
          <a href="/potato/trade/productWrite" class="btn btn-outline-warning">제품 등록</a>
        </div>
      </div>
    </div>
    <br>

    <div class="border-top mt-2 mb-2"></div>

    <!-- 지역구 선택 버튼 -->
    <h5 style="margin-top: 20px;"><b>부산광역시</b></h5>
    <button onclick="toggleLocalGuList()"  class="me-5 link-dark hover-effect">지역구 선택</button>
    <ul id="localGuList" style="display: none;">
      <!-- 지역구 목록을 JavaScript로 동적으로 추가 -->
    </ul>

    <!-- 카테고리 선택 부분 -->
    <h5 style="margin-top: 20px;"><b>카테고리</b></h5>
    <ul id="categoryList">
      <!-- 카테고리 목록을 JavaScript 로 동적으로 추가 -->
    </ul>

    <div style="width: 200px; height: 1px; background-color: black; margin-top: 10px;"></div>

    <!--나눔 버튼-->
    <h5 style="margin-top: 20px;"><b>share</b></h5>
    <ul>
      <li style="list-style: none;">
        <button type="button" class="price-btn" data-min="null" data-max="null" data-type="free">나눔</button>
      </li>
    </ul>

  </aside>
  <main>
    <!--상품 목록-->
    <section class="row item-list" id="productList">
      <!-- 로그인된 상태일 때만 제품 등록 버튼 보이기 -->

      <div id="productListContainer" class="row">
        <!-- 타임리프로 서버에서 렌더링된 상품 목록 -->
        <div th:if="${#lists.size(productList)} > 0" th:each="product : ${productList}"
             class="product-card col-lg-3 col-md-4 col-sm-6 mb-4">
          <div class="card" th:onclick="|location.href='/potato/trade/productDetail?productNum=${product.productNum}'|" style="cursor: pointer;">
            <!-- 외부 URL (http/https) 또는 로컬 경로 둘 다 지원 -->
            <img th:src="@{${product.productImg}}" alt="상품 이미지" class="card-img-top">

            <div class="card-body">
              <p class="card-title" th:text="${product.productName}">상품 제목</p>
              <p class="card-price" th:text="${product.productPrice}">1000원</p>
              <p class="card-location" th:text="${product.localGuName}">상품 위치</p>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>
</body>
<footer th:replace="/layout/footer :: footer"></footer>
</html>
